name: Quik
options:
  bundleIdPrefix: dev.quik
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: NO
targets:
  Quik:
    type: application
    platform: macOS
    sources:
      - path: Sources
    info:
      path: Sources/App/Info.plist
      properties:
        LSUIElement: false
        CFBundleName: Quik
        CFBundleDisplayName: Quik
        CFBundleShortVersionString: "0.1.2"
        LSMinimumSystemVersion: "14.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.quik.app
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Probe/CShim/Quik-Bridging-Header.h
        OTHER_LDFLAGS: "-lproc"
  QuikTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Quik
